services:
  postgres:
    image: postgres:17-alpine
    container_name: saas-starter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: saas_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
