name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Strict Typecheck
        run: npx tsc --noEmit

      - name: Lint & Boundary Rules Check
        run: npm run lint

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Production Next.js Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_NAME: Core SaaS Starter Kit
          NEXT_PUBLIC_API_URL: /api
          NEXT_PUBLIC_DEFAULT_TENANT: default
